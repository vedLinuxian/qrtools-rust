[package]
name = "qrtools-web"
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["VedLinuxian <github.com/vedLinuxian>"]
description = "Advanced QR code platform — encode, decode, batch, logo overlay, WiFi/vCard payloads, Prometheus metrics, WebSocket stats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vedLinuxian/qrtools-rust"
homepage = "https://github.com/vedLinuxian/qrtools-rust"
keywords = ["qrcode", "axum", "web", "dashboard", "encode"]
categories = ["web-programming", "command-line-utilities"]

[lib]
name  = "qrtools_lib"
path  = "src/lib.rs"

[[bin]]
name = "qrtools-web"
path = "src/main.rs"

[dependencies]
# ── Web framework ─────────────────────────────────────────────────────────────
axum            = { version = "0.8", features = ["multipart", "macros", "ws"] }
tokio           = { version = "1",   features = ["full"] }
tower           = { version = "0.5", features = ["util"] }
tower-http      = { version = "0.6", features = [
    "cors", "trace", "compression-gzip", "compression-br",
    "fs", "limit", "timeout",
] }

# ── QR / barcode ──────────────────────────────────────────────────────────────
qrcode          = "0.14"
rxing           = { version = "0.6", default-features = false, features = ["image"] }

# ── Image processing ──────────────────────────────────────────────────────────
image           = { version = "0.25", features = ["png", "jpeg", "webp", "gif"] }
imageproc       = "0.25"
ab_glyph        = "0.2"

# ── Serde / JSON ──────────────────────────────────────────────────────────────
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror       = "2"
anyhow          = "1"

# ── Observability ─────────────────────────────────────────────────────────────
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics                     = "0.23"
metrics-exporter-prometheus = "0.15"

# ── Rate limiting ─────────────────────────────────────────────────────────────
governor        = { version = "0.6", default-features = false, features = ["std", "dashmap"] }

# ── Persistence (SQLite) ──────────────────────────────────────────────────────
sqlx            = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }

# ── HTTP client (URL-based decode) ────────────────────────────────────────────
reqwest         = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ── Archive / export ──────────────────────────────────────────────────────────
zip             = "2"

# ── Utilities ─────────────────────────────────────────────────────────────────
base64          = "0.22"
http            = "1"
bytes           = "1"
futures         = "0.3"
dotenvy         = "0.15"
uuid            = { version = "1", features = ["v4"] }
chrono          = { version = "0.4", features = ["serde"] }
moka            = { version = "0.12", features = ["future"] }
csscolorparser  = "0.6"
tokio-stream    = { version = "0.1", features = ["sync"] }
once_cell       = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile   = "3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
