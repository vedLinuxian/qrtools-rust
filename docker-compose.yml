version: "3.9"

services:
  qrtools:
    build:
      context: .
      dockerfile: Dockerfile
    image: qrtools-web:latest
    container_name: qrtools-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      LOG_LEVEL: "info"
      JSON_LOGGING: "true"
      CORS_ORIGINS: "*"
      MAX_UPLOAD_BYTES: "10485760"   # 10 MB
      HISTORY_CAPACITY: "500"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
